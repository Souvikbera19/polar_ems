[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "polar-ems"
version = "0.1.0"
description = "Predictive energy management simulator for polar research stations"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "streamlit>=1.38", "plotly>=5.24", "pandas>=2.2", "numpy>=2.0", "scikit-learn>=1.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
